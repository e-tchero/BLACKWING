[package]
name = "bw-capture"
version = "0.1.0"
edition = "2021"

[dependencies]
thiserror = "1.0"
tokio = { version = "1.0", features = ["full"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
] }

# Mirrors the workspace lint policy (see root Cargo.toml) with one deliberate
# override: `unsafe_code` is `allow` (not `forbid`) because the DXGI/WGC COM
# interop in this crate inherently requires `unsafe`. Justification is
# documented in src/lib.rs. Per-crate overrides cannot be merged with
# `[lints] workspace = true`, so the full table is spelled out here.
[lints.rust]
unsafe_code = "allow"
missing_docs = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
todo = "deny"
dbg_macro = "deny"
