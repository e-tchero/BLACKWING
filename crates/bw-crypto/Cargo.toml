[package]
name = "bw-crypto"
version = "0.1.0"
edition = "2021"

[features]
default = []
serde = ["dep:serde"]

[dependencies]
ed25519-dalek = "2.0"
thiserror = "1.0"
zeroize = { workspace = true }
sha2 = "0.10"
subtle = "2.5"
getrandom = "0.2"
serde = { workspace = true, optional = true }

[dev-dependencies]
proptest = "1.0"
serde_json = "1.0"

[dev-dependencies.bw-crypto]
path = "."
features = ["serde"]
