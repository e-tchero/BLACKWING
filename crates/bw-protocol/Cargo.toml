[package]
name = "bw-protocol"
version = "0.1.0"
edition = "2021"

[dependencies]
bw-crypto = { path = "../bw-crypto", features = ["serde"] }
serde = { workspace = true, features = ["derive"] }
thiserror = "1"
zeroize = { workspace = true }
bytemuck = { workspace = true }
subtle = "2.5"
ciborium = "0.2"
tokio = { workspace = true }
futures = "0.3"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "placeholder"
harness = false

[[bench]]
name = "crypto_bench"
harness = false
