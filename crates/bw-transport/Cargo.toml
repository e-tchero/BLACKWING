[package]
name = "bw-transport"
version = "0.1.0"
edition = "2021"

[dependencies]
bw-core = { path = "../bw-core" }
bw-crypto = { path = "../bw-crypto" }
bw-protocol = { path = "../bw-protocol" }

quinn = "0.11"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rcgen = "0.13"
tokio = { version = "1.0", features = ["full"] }
thiserror = "1.0"

[dev-dependencies]
bw-relay = { path = "../bw-relay" }
bw-crypto = { path = "../bw-crypto", features = ["serde"] }

[lints]
workspace = true
