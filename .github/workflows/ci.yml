name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: ${{ matrix.os == 'ubuntu-latest' && 'Linux' || 'Windows' }} validation
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    timeout-minutes: 15

    env:
      CARGO_TERM_COLOR: always
      RUSTFLAGS: ""

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable toolchain
        id: toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install MinGW toolchain (Windows only)
        if: runner.os == 'Windows'
        run: |
          scoop install mingw
        shell: powershell

      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y             build-essential             pkg-config             libasound2-dev             libx11-dev             libxrandr-dev             libxi-dev             libxinerama-dev             libxcursor-dev             libwayland-dev             libdbus-1-dev             libgl-dev             libvulkan-dev
        shell: bash

      - name: Cache Cargo artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}-${{ steps.toolchain.outputs.rustc }}

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo check --workspace
        run: |
          cargo check --workspace${{ matrix.os == 'Linux' && ' --exclude bw-capture --exclude bw-input' || '' }}

      - name: cargo check --workspace --all-features
        run: |
          cargo check --workspace --all-features${{ matrix.os == 'Linux' && ' --exclude bw-capture --exclude bw-input' || '' }}

      - name: cargo clippy --workspace --all-targets --all-features -- -D warnings
        run: |
          cargo clippy --workspace --all-targets --all-features${{ matrix.os == 'Linux' && ' --exclude bw-capture --exclude bw-input' || '' }} -- -D warnings

      - name: cargo test --workspace
        run: |
          cargo test --workspace${{ matrix.os == 'Linux' && ' --exclude bw-capture --exclude bw-input' || '' }}

      - name: cargo test --workspace --all-features
        run: |
          cargo test --workspace --all-features${{ matrix.os == 'Linux' && ' --exclude bw-capture --exclude bw-input' || '' }}

      - name: cargo bench --no-run --workspace
        run: |
          cargo bench --no-run --workspace${{ matrix.os == 'Linux' && ' --exclude bw-capture --exclude bw-input' || '' }}
